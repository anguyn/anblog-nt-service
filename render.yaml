services:
  # Main API + Socket.IO Server
  - type: web
    name: anblog-notification-api
    env: node
    region: singapore
    plan: starter
    rootDir: ./
    buildCommand: yarn install && yarn build
    startCommand: ls -la && ls -la dist && yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # Redis - Aiven (external)
      - key: REDIS_URL
        sync: false # Set manually trong dashboard

      # Main App
      - key: MAIN_APP_URL
        value: https://your-blog.com # Thay bằng URL blog của bạn
      - key: APP_URL
        value: https://your-blog.com

      # Email - Resend
      - key: RESEND_API_KEY
        sync: false # Set manually
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: FROM_NAME
        value: Anvel

      # Security
      - key: API_SECRET_KEY
        sync: false # Set manually
      - key: JWT_SECRET_KEY
        sync: false # Set manually

      # Rate Limiting
      - key: RATE_LIMIT_VERIFICATION_RESEND
        value: 5m
      - key: RATE_LIMIT_PASSWORD_RESET_RESEND
        value: 5m
      - key: RATE_LIMIT_MAX_VERIFICATION_PER_HOUR
        value: 3
      - key: RATE_LIMIT_MAX_PASSWORD_RESET_PER_HOUR
        value: 3
      - key: RATE_LIMIT_MAX_EMAILS_PER_USER_PER_MINUTE
        value: 10

      # Token Expiry
      - key: VERIFICATION_TOKEN_EXPIRY
        value: 24h
      - key: PASSWORD_RESET_TOKEN_EXPIRY
        value: 1h

  # Background Worker
  - type: worker
    name: anblog-notification-worker
    env: node
    region: singapore
    plan: starter
    rootDir: ./
    buildCommand: yarn install && yarn build
    startCommand: yarn worker
    envVars:
      - key: NODE_ENV
        value: production

      # Redis - Aiven (dùng chung với API)
      - key: REDIS_URL
        sync: false

      # Email - Resend
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: FROM_NAME
        value: Anvel

      # Security
      - key: API_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
